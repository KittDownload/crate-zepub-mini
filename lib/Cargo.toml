[package]
name = "zepub-mini"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = { workspace = true }
repository = { workspace = true }
readme = { workspace = true }
keywords = { workspace = true }
rust-version = { workspace = true }

[dependencies]
zip = "8.5.0"
anyhow = "1.0.102"
quick-xml = { version = "0.39.2" }
ab_glyph = { version = "0.2.32", optional = true }
imageproc = { version = "0.26.1", optional = true }
serde_json = { version = "1.0.149", optional = true }
zepub-mini-derive = { path = "../derive", version = "0.1.0-alpha.2" }
serde = { version = "1.0.228", features = ["derive"], optional = true }
image = { version = "0.25.10", default-features = false, features = ["jpeg"], optional = true }
md-5 = {version = "0.11.0", optional = true }

[dev-dependencies]
reqwest = { version = "0.13.2", features = ["blocking"] }

[features]
no_nav = []
cache = ["dep:serde","dep:serde_json"]
cover = ["dep:ab_glyph","dep:image","dep:imageproc"]
